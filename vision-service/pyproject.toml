[project]
name = "vision-service"
version = "0.1.0"
description = "civic-repairs vision service: SAM 3.1 client (Meta Model API), blurring, damage area, before/after comparison. CPU only."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "numpy>=2.3",
    "opencv-python-headless>=4.12",
    "pydantic-settings>=2.11",
    "python-multipart>=0.0.20",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
