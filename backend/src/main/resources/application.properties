spring.application.name=civic-repairs-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:civic_repairs}}
spring.datasource.username=${POSTGRES_USER:civic}
spring.datasource.password=${POSTGRES_PASSWORD:civic}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# 8080 in containers; locally set BACKEND_PORT in .env if 8080 is taken.
server.port=${BACKEND_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# Uploads from the web form (Nginx allows 25 MB).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Meta Model API. Disabled by default: fakes, no credits spent (see docs/meta-api.md).
civic.meta.enabled=${META_API_ENABLED:false}
civic.meta.api-key=${META_API_KEY:}
civic.meta.base-url=${META_API_BASE_URL:https://api.meta.ai/v1}
civic.meta.muse-model=${MUSE_MODEL:muse-spark-1.3}
civic.meta.budget-limit-usd=${META_BUDGET_LIMIT_USD:120}
civic.meta.muse-input-per-million=1.25
civic.meta.muse-cached-input-per-million=0.15
civic.meta.muse-output-per-million=4.25

# vision-service. Empty = in-memory fake (placeholder images, never the original photo).
civic.vision.url=${VISION_SERVICE_URL:}
civic.media.path=${MEDIA_STORAGE_PATH:./data/media}

civic.reporter-hash-salt=${PHONE_HASH_SALT:dev-only-salt-not-for-production}
civic.reports.per-reporter-per-day=${REPORTS_PER_PHONE_PER_DAY:10}
civic.reports.dedup-radius-meters=30
civic.reports.same-damage-min-confidence=0.7

# WhatsApp Cloud API (docs/whatsapp-templates.md). Empty token = replies are only logged.
civic.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
civic.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
civic.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
civic.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
civic.whatsapp.graph-base-url=https://graph.facebook.com/v25.0

# Shown to citizens (links to the map).
civic.public-base-url=${PUBLIC_BASE_URL:https://civic.jesusflorez.cloud}
