spring.application.name=civic-repairs-backend

# Local dev: read the repo's .env (absent in containers, where real env vars are used).
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:civic_repairs}}
spring.datasource.username=${POSTGRES_USER:civic}
spring.datasource.password=${POSTGRES_PASSWORD:civic}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# 8080 in containers; locally set BACKEND_PORT in .env if 8080 is taken.
server.port=${BACKEND_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
